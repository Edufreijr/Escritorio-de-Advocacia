<main class="admin-layout">

  <aside class="admin-sidebar">

    <div class="admin-brand">
      <span class="admin-brand-label">
        ARAÚJO & FREITAS
      </span>

      <strong>
        Painel Administrativo
      </strong>
    </div>

    <div class="admin-profile">

      <div class="admin-profile-avatar">
        {{ user()?.name?.charAt(0)?.toUpperCase() }}
      </div>

      <div class="admin-profile-info">
        <strong>
          {{ user()?.name }}
        </strong>

        <span>
          Administrador
        </span>
      </div>

    </div>

    <nav class="admin-navigation">

      <span class="admin-navigation-label">
        VISÃO GERAL
      </span>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-item"
      >
        <span class="admin-nav-icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <span class="admin-navigation-label">
        GESTÃO
      </span>

      <a
        routerLink="/admin/usuarios"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-item"
      >
        <span class="admin-nav-icon">◉</span>
        <span>Usuários</span>
      </a>

      <a
        routerLink="/admin/advogados"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-item"
      >
        <span class="admin-nav-icon">⚖</span>
        <span>Advogados</span>
      </a>

      <a
        routerLink="/admin/agendamentos"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-item"
      >
        <span class="admin-nav-icon">▣</span>
        <span>Agendamentos</span>
      </a>

      <a
        routerLink="/admin/mensagens"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-item"
      >
        <span class="admin-nav-icon">✉</span>
        <span>Mensagens</span>
      </a>

    </nav>

    <div class="admin-sidebar-footer">

      <a
        routerLink="/"
        class="admin-footer-link"
      >
        ← Voltar para o site
      </a>

      <button
        type="button"
        class="admin-footer-link admin-logout"
        (click)="logout()"
      >
        Sair da conta
      </button>

    </div>

  </aside>

  <section class="admin-content">

    <header class="admin-mobile-header">

      <div>
        <span>
          ARAÚJO & FREITAS
        </span>

        <strong>
          Painel Administrativo
        </strong>
      </div>

      <button
        type="button"
        class="admin-mobile-logout"
        (click)="logout()"
      >
        Sair
      </button>

    </header>

    <div class="admin-content-inner">
      <router-outlet></router-outlet>
    </div>

  </section>

</main>
